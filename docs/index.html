<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toss Auto Trade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #12151a;
  --panel: #1b1f27;
  --border: #2a2f38;
  --text: #e8e6e1;
  --text-dim: #8b909c;
  --gold: #c9a227;
  --teal: #4fb3a5;
  --red: #c1554b;
  --blue: #5b8fd6;
  --violet: #8a7fd6;
  --sans: 'Space Grotesk', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 60px; }

header { margin-bottom: 20px; }
header .updated {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 0;
}

section.panel {
  border-top: 1px solid var(--border);
  padding: 18px 0;
}
section.panel:first-of-type { border-top: none; padding-top: 0; }
#view-p458dsuf { margin-top: 8px; }
#view-p458dsuf > section.panel:first-of-type { border-top: 1px solid var(--border); padding-top: 18px; }

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}
.metrics.cols-3 { grid-template-columns: repeat(3, 1fr); }
.metrics.cols-3 .value { font-size: 13px; }
.metric {
  background: var(--bg);
  padding: 12px 8px;
}
.metric .label {
  font-size: 11px;
  color: var(--text-dim);
  margin: 0 0 6px;
}
.metric .value {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  margin: 0;
}
.metric.gold .value { color: var(--gold); }
.metric.teal .value { color: var(--teal); }
.metric.violet .value { color: var(--violet); }
.metric.blue .value { color: var(--blue); }

h2.section-title {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
  margin: 0 0 12px;
}

.tier-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 13px;
}
.tier-row:last-child { border-bottom: none; }
.tier-row .main { color: var(--text); }
.tier-row .sub { color: var(--text-dim); font-size: 12px; }
.tier-row .badge {
  font-size: 11px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.tier-row .badge.warn { color: var(--red); border-color: var(--red); }
.tier-row .badge.ok { color: var(--teal); border-color: var(--teal); }

.empty {
  color: var(--text-dim);
  font-size: 13px;
  font-family: var(--mono);
  padding: 8px 0;
}

.chart-wrap { position: relative; height: 220px; }

.legend-row {
  display: flex; gap: 14px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  margin-top: 10px;
}
.legend-row span { display: flex; align-items: center; gap: 5px; }
.legend-row i { width: 9px; height: 9px; display: inline-block; border-radius: 1px; }

footer {
  margin-top: 30px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="updated" id="updated">불러오는 중...</p>
    <p class="updated" id="grand-total" style="margin-top:4px; font-size:13px; color:var(--text);"></p>
  </header>

  <!-- csuf 전용 뷰 -->
  <div id="view-csuf">
    <section class="panel">
      <div class="metrics">
        <div class="metric gold"><p class="label">총투자</p><p class="value" id="m-invest">-</p></div>
        <div class="metric"><p class="label">총매입</p><p class="value" id="m-bought">-</p></div>
        <div class="metric teal"><p class="label">잔금</p><p class="value" id="m-cash">-</p></div>
        <div class="metric" id="m-pending-card" style="display:none;"><p class="label">미체결</p><p class="value" id="m-pending">-</p></div>
      </div>
    </section>

    <section class="panel">
      <h2 class="section-title">보유 티어</h2>
      <div id="tiers"></div>
    </section>
  </div>

  <!-- p458/dSuf/csuf 비교 뷰 -->
  <div id="view-p458dsuf">
    <section class="panel">
      <div class="metrics">
        <div class="metric blue"><p class="label">csuf 자산(버퍼)</p><p class="value" id="pd-csuf">-</p></div>
        <div class="metric gold"><p class="label">p458 자산</p><p class="value" id="pd-p458">-</p></div>
        <div class="metric teal"><p class="label">dSuf 자산</p><p class="value" id="pd-dsuf">-</p></div>
        <div class="metric violet"><p class="label">총자산</p><p class="value" id="pd-total">-</p></div>
      </div>
    </section>

    <section class="panel">
      <h2 class="section-title">SOXL 대비 자산추이 (누적수익률 %)</h2>
      <div class="chart-wrap"><canvas id="pd-chart"></canvas></div>
      <div class="legend-row">
        <span><i style="background:#5b8fd6"></i>csuf(버퍼)</span>
        <span><i style="background:#c9a227"></i>p458</span>
        <span><i style="background:#4fb3a5"></i>dSuf</span>
        <span><i style="background:#8a7fd6"></i>Total</span>
        <span><i style="background:#8b909c"></i>SOXL</span>
      </div>
    </section>
  </div>

  <footer>oifrit/Toss-Auto-Trade</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
let pdChart = null;
let currentData = null;

function fmtMoney(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

function monthTickCallback(labels) {
  return function (val, idx) {
    const d = labels[idx];
    if (!d) return '';
    const month = d.slice(5, 7);
    if (idx === 0 || labels[idx - 1].slice(5, 7) !== month) {
      return parseInt(month, 10) + '월';
    }
    return '';
  };
}

// labels(날짜 배열) 중 matchFn을 통과하는 이체(transfer)들을 날짜별로 합산해
// 세로 점선 + 금액 라벨로 표시하는 Chart.js 플러그인을 만든다.
function makeTransferPlugin(labels, transfers, matchFn, color, sign) {
  const byDate = {};
  (transfers || []).filter(matchFn).forEach(t => {
    byDate[t.date] = (byDate[t.date] || 0) + t.amount;
  });
  return {
    id: 'transferMarker',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const xScale = scales.x;
      ctx.save();
      Object.keys(byDate).forEach(date => {
        const idx = labels.indexOf(date);
        if (idx === -1) return;
        const x = xScale.getPixelForValue(idx);
        ctx.strokeStyle = color;
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = color;
        ctx.font = '10px JetBrains Mono';
        ctx.textAlign = x > (chartArea.left + chartArea.right) / 2 ? 'right' : 'left';
        const label = `이체 ${sign}$${Math.round(byDate[date]).toLocaleString('en-US')}`;
        ctx.fillText(label, x + (ctx.textAlign === 'right' ? -4 : 4), chartArea.top + 10);
      });
      ctx.restore();
    },
  };
}

function renderAccount(key) {
  const acc = currentData.accounts[key];

  const bufferNote = acc.buffer_usd ? `(${Math.round(acc.buffer_usd)})` : '';
  document.getElementById('m-invest').textContent = fmtMoney(acc.total_invest) + bufferNote;
  document.getElementById('m-bought').textContent = fmtMoney(acc.total_bought);
  document.getElementById('m-cash').textContent = fmtMoney(acc.cash);
  const pendingCard = document.getElementById('m-pending-card');
  if (acc.pending_amount && acc.pending_amount > 0) {
    pendingCard.style.display = '';
    document.getElementById('m-pending').textContent = fmtMoney(acc.pending_amount);
  } else {
    pendingCard.style.display = 'none';
  }

  const tiersEl = document.getElementById('tiers');
  tiersEl.innerHTML = '';
  const tiers = acc.tiers || [];
  if (tiers.length === 0 && !acc.pending_order) {
    tiersEl.innerHTML = '<p class="empty">보유 중인 티어가 없습니다.</p>';
  } else {
    tiers.forEach((t) => {
      const held = t.held_days;
      const warn = typeof held === 'number' && held >= 3;
      const row = document.createElement('div');
      row.className = 'tier-row';
      row.innerHTML = `
        <div>
          <div class="main">${t.buy_date} · ${Math.round(t.quantity)}주</div>
          <div class="sub">$${t.buy_price.toFixed(2)} → $${t.sell_target.toFixed(2)}</div>
        </div>
        <span class="badge ${warn ? 'warn' : 'ok'}">${held ?? '?'}일</span>
      `;
      tiersEl.appendChild(row);
    });
    if (acc.pending_order) {
      const p = acc.pending_order;
      const row = document.createElement('div');
      row.className = 'tier-row';
      row.innerHTML = `
        <div>
          <div class="main">체결대기 · ${Math.round(p.quantity)}주</div>
          <div class="sub">$${p.order_price_used.toFixed(2)}</div>
        </div>
        <span class="badge">대기</span>
      `;
      tiersEl.appendChild(row);
    }
  }

}

function toPctSeries(values) {
  const base = values.find(v => v !== null && v !== undefined && v !== 0);
  if (base === undefined) return values.map(() => null);
  return values.map(v => (v === null || v === undefined) ? null : (v / base - 1) * 100);
}

function renderP458Dsuf() {
  const pd = currentData.p458dsuf || { history: [], soxl_history: [] };
  // acct.xlsx 자체가 이미 거래일만 담고 있으므로(휴장일 행 삭제됨) 별도 필터 불필요.
  // 그래프는 이 history의 날짜에 해당하는 SOXL 캔들만 그대로 매칭해서 사용.
  const history = pd.history || [];
  const soxlHistory = pd.soxl_history || [];

  const last = history[history.length - 1];
  const first = history[0];
  function withPct(curVal, firstVal) {
    if (curVal === null || curVal === undefined) return '-';
    if (!first || !firstVal) return fmtMoney(curVal);
    const pct = (curVal / firstVal - 1) * 100;
    const sign = pct >= 0 ? '+' : '';
    return `${fmtMoney(curVal)} (${sign}${pct.toFixed(1)}%)`;
  }
  document.getElementById('pd-p458').textContent = last ? withPct(last.p458, first.p458) : '-';
  document.getElementById('pd-dsuf').textContent = last ? withPct(last.dsuf, first.dsuf) : '-';
  document.getElementById('pd-csuf').textContent = last ? withPct(last.csuf, first.csuf) : '-';
  document.getElementById('pd-total').textContent = last ? withPct(last.total, first.total) : '-';

  const soxlMap = {};
  soxlHistory.forEach(s => { soxlMap[s.date] = s.close; });

  const labels = history.map(h => h.date);
  const p458Pct = toPctSeries(history.map(h => h.p458));
  const dsufPct = toPctSeries(history.map(h => h.dsuf));
  const csufPct = toPctSeries(history.map(h => h.csuf !== undefined ? h.csuf : null));
  const totalPct = toPctSeries(history.map(h => h.total));
  const soxlPct = toPctSeries(labels.map(d => soxlMap[d] !== undefined ? soxlMap[d] : null));

  // 마우스오버 시 보여줄 실제값(달러/가격) 맵 — 인덱스로 조회
  const realValues = {
    p458: history.map(h => h.p458),
    dSuf: history.map(h => h.dsuf),
    'csuf(버퍼)': history.map(h => h.csuf !== undefined ? h.csuf : null),
    Total: history.map(h => h.total),
    SOXL: labels.map(d => soxlMap[d] !== undefined ? soxlMap[d] : null),
  };

  // 월이 바뀌는 인덱스마다 세로 구분선을 그리는 플러그인
  const monthDividerPlugin = {
    id: 'monthDivider',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const xScale = scales.x;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      labels.forEach((d, idx) => {
        if (idx === 0) return;
        if (d.slice(5, 7) !== labels[idx - 1].slice(5, 7)) {
          const x = xScale.getPixelForValue(idx);
          ctx.beginPath();
          ctx.moveTo(x, chartArea.top);
          ctx.lineTo(x, chartArea.bottom);
          ctx.stroke();
        }
      });
      ctx.restore();
    },
  };

  const outTransferPlugin = makeTransferPlugin(
    labels, currentData.transfers, t => t.from === 'p458' || t.from === 'dsuf', '#c1554b', '-'
  );

  const ctx = document.getElementById('pd-chart');
  if (pdChart) pdChart.destroy();
  pdChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'csuf(버퍼)', data: csufPct, borderColor: '#5b8fd6', pointRadius: 0, borderWidth: 2, tension: 0.2 },
        { label: 'p458', data: p458Pct, borderColor: '#c9a227', pointRadius: 0, borderWidth: 2, tension: 0.2 },
        { label: 'dSuf', data: dsufPct, borderColor: '#4fb3a5', pointRadius: 0, borderWidth: 2, tension: 0.2 },
        { label: 'Total', data: totalPct, borderColor: '#8a7fd6', pointRadius: 0, borderWidth: 2, tension: 0.2 },
        { label: 'SOXL', data: soxlPct, borderColor: '#8b909c', pointRadius: 0, borderWidth: 1.5, borderDash: [3,3], tension: 0.2 },
      ]
    },
    plugins: [monthDividerPlugin, outTransferPlugin],
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (item) => {
              const idx = item.dataIndex;
              const name = item.dataset.label;
              const raw = realValues[name] ? realValues[name][idx] : null;
              const pct = item.parsed.y;
              const pctStr = (pct === null || pct === undefined) ? '-' : `${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
              if (raw === null || raw === undefined) return `${name}: ${pctStr}`;
              const realStr = name === 'SOXL' ? `$${raw.toFixed(2)}` : fmtMoney(raw);
              return `${name}: ${realStr} (${pctStr})`;
            },
          },
        },
      },
      scales: {
        x: {
          display: true,
          grid: { display: false },
          ticks: {
            color: '#8b909c',
            font: { family: 'JetBrains Mono', size: 10 },
            autoSkip: false,
            maxRotation: 0,
            callback: monthTickCallback(labels),
          },
        },
        y: {
          display: true,
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#8b909c',
            font: { family: 'JetBrains Mono', size: 10 },
            callback: (v) => v.toFixed(0) + '%',
            maxTicksLimit: 5,
          },
        },
      },
    }
  });
}

fetch('./data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    currentData = data;
    document.getElementById('updated').textContent = '업데이트: ' + new Date(data.updated_at).toLocaleString('ko-KR');

    // 탭 없이 한 페이지에 순서대로: csuf 개별 뷰 -> csuf/p458/dSuf 비교 뷰
    const csufKey = Object.keys(data.accounts || {}).find(k => (data.accounts[k].label || k) === 'csuf')
      || Object.keys(data.accounts || {})[0];
    if (csufKey) renderAccount(csufKey);
    if (data.p458dsuf) renderP458Dsuf();

    // p458dsuf.history[].total은 이제 csuf(acct.xlsx 스냅샷, 버퍼포함)까지 합산된 값이라,
    // 상단 총자산 요약은 그 csuf를 빼고 accounts.csuf.total_invest(실시간 값)로 대체해서
    // 이중합산을 피하고 최신값을 쓴다.
    const csufAcc = Object.values(data.accounts || {}).find(a => a.label === 'csuf');
    const csufTotalInvest = csufAcc ? csufAcc.total_invest : 0;
    const pdHistory = (data.p458dsuf && data.p458dsuf.history) || [];
    const pdLatest = pdHistory.length ? pdHistory[pdHistory.length - 1] : null;
    const pdP458DsufOnly = pdLatest ? (pdLatest.p458 + pdLatest.dsuf) : 0;
    const grandTotalUsd = csufTotalInvest + pdP458DsufOnly;
    const grandEl = document.getElementById('grand-total');

    // 전일 대비 변동분: 각 계좌 히스토리의 마지막 두 스냅샷 차이를 더함
    // (csuf/p458dsuf 히스토리 날짜가 서로 안 맞아도 각자 자기 시계열 기준으로 변동을 구하므로 문제없음)
    const csufHist = (csufAcc && csufAcc.history) || [];
    const csufDelta = csufHist.length >= 2
      ? csufHist[csufHist.length - 1].total_assets - csufHist[csufHist.length - 2].total_assets
      : 0;
    const pdDelta = pdHistory.length >= 2
      ? (pdHistory[pdHistory.length - 1].p458 + pdHistory[pdHistory.length - 1].dsuf)
        - (pdHistory[pdHistory.length - 2].p458 + pdHistory[pdHistory.length - 2].dsuf)
      : 0;
    const grandDelta = csufDelta + pdDelta;
    const deltaSign = grandDelta > 0 ? '+' : '';
    // 국내 증시 관행: 상승(+)은 빨강, 하락(-)은 파랑
    const deltaColor = grandDelta > 0 ? 'var(--red)' : (grandDelta < 0 ? 'var(--blue)' : 'var(--text-dim)');
    const deltaHtml = `<span style="color:${deltaColor}">(${deltaSign}${Math.round(grandDelta).toLocaleString('en-US')})</span>`;

    if (data.usd_krw_rate) {
      const krw = grandTotalUsd * data.usd_krw_rate;
      grandEl.innerHTML = `총자산: $${Math.round(grandTotalUsd).toLocaleString('en-US')} ${deltaHtml} (₩${Math.round(krw).toLocaleString('en-US')})`;
    } else {
      grandEl.innerHTML = `총자산: $${Math.round(grandTotalUsd).toLocaleString('en-US')} ${deltaHtml} (환율 정보 없음)`;
    }
  })
  .catch(err => {
    document.getElementById('updated').textContent = '데이터를 불러오지 못했습니다.';
    console.error(err);
  });
</script>
</body>
</html>
