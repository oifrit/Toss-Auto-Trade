<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toss Auto Trade — csuf</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #12151a;
  --panel: #1b1f27;
  --border: #2a2f38;
  --text: #e8e6e1;
  --text-dim: #8b909c;
  --gold: #c9a227;
  --teal: #4fb3a5;
  --red: #c1554b;
  --sans: 'Space Grotesk', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 60px; }

header { margin-bottom: 20px; }
header .eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
  margin: 0 0 4px;
}
header h1 {
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}
header .updated {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 6px;
}

nav.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
}
nav.tabs button {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  padding: 10px 4px;
  margin-right: 20px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
nav.tabs button.active {
  color: var(--text);
  border-bottom-color: var(--gold);
}

section.panel {
  border-top: 1px solid var(--border);
  padding: 18px 0;
}
section.panel:first-of-type { border-top: none; padding-top: 0; }

.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}
.metric {
  background: var(--bg);
  padding: 14px 12px;
}
.metric .label {
  font-size: 11px;
  color: var(--text-dim);
  margin: 0 0 6px;
}
.metric .value {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
  margin: 0;
}
.metric.gold .value { color: var(--gold); }
.metric.teal .value { color: var(--teal); }

h2.section-title {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
  margin: 0 0 12px;
}

.tier-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 13px;
}
.tier-row:last-child { border-bottom: none; }
.tier-row .main { color: var(--text); }
.tier-row .sub { color: var(--text-dim); font-size: 12px; }
.tier-row .badge {
  font-size: 11px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.tier-row .badge.warn { color: var(--red); border-color: var(--red); }
.tier-row .badge.ok { color: var(--teal); border-color: var(--teal); }

.empty {
  color: var(--text-dim);
  font-size: 13px;
  font-family: var(--mono);
  padding: 8px 0;
}

.chart-wrap { position: relative; height: 160px; }

.compare-row { margin-bottom: 14px; }
.compare-row .top {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 13px;
  margin-bottom: 5px;
}
.compare-row .bar {
  height: 6px;
  background: var(--panel);
  border: 1px solid var(--border);
}
.compare-row .bar-fill { height: 100%; }
.compare-row .bar-fill.gold { background: var(--gold); }
.compare-row .bar-fill.teal { background: var(--teal); }

footer {
  margin-top: 30px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">csuf / SOXL</p>
    <h1>자동매매 현황</h1>
    <p class="updated" id="updated">불러오는 중...</p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <section class="panel">
    <div class="metrics">
      <div class="metric gold"><p class="label">총투자</p><p class="value" id="m-invest">-</p></div>
      <div class="metric"><p class="label">총매입</p><p class="value" id="m-bought">-</p></div>
      <div class="metric teal"><p class="label">잔금</p><p class="value" id="m-cash">-</p></div>
    </div>
  </section>

  <section class="panel">
    <h2 class="section-title">보유 티어</h2>
    <div id="tiers"></div>
  </section>

  <section class="panel">
    <h2 class="section-title">자산 추이</h2>
    <div class="chart-wrap"><canvas id="trend"></canvas></div>
  </section>

  <section class="panel">
    <h2 class="section-title">백테스트 대비 실전 (CAGR)</h2>
    <div id="compare"></div>
  </section>

  <footer>oifrit/Toss-Auto-Trade</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const BACKTEST_CAGR = 194; // csuf v2 백테스트 CAGR (%), 필요시 이 숫자만 갱신

let chart = null;
let currentData = null;
let currentKey = null;

function fmtMoney(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

function computePerformance(history) {
  if (!history || history.length < 2) return null;
  const first = history[0], last = history[history.length - 1];
  const days = (new Date(last.date) - new Date(first.date)) / 86400000;
  if (days <= 0 || first.total_assets <= 0) return null;
  const totalReturn = (last.total_assets / first.total_assets - 1) * 100;
  if (days < 30) {
    return { mode: 'cumulative', value: totalReturn, days };
  }
  const years = days / 365.25;
  const cagr = (Math.pow(last.total_assets / first.total_assets, 1 / years) - 1) * 100;
  return { mode: 'cagr', value: cagr, days };
}

function renderAccount(key) {
  currentKey = key;
  const acc = currentData.accounts[key];
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });

  document.getElementById('m-invest').textContent = fmtMoney(acc.total_invest);
  document.getElementById('m-bought').textContent = fmtMoney(acc.total_bought);
  document.getElementById('m-cash').textContent = fmtMoney(acc.cash);

  const tiersEl = document.getElementById('tiers');
  tiersEl.innerHTML = '';
  const tiers = acc.tiers || [];
  if (tiers.length === 0 && !acc.pending_order) {
    tiersEl.innerHTML = '<p class="empty">보유 중인 티어가 없습니다.</p>';
  } else {
    tiers.forEach((t, i) => {
      const held = t.held_days;
      const warn = typeof held === 'number' && held >= 3;
      const row = document.createElement('div');
      row.className = 'tier-row';
      row.innerHTML = `
        <div>
          <div class="main">${t.buy_date} · ${t.quantity}주</div>
          <div class="sub">$${t.buy_price.toFixed(2)} → $${t.sell_target.toFixed(2)}</div>
        </div>
        <span class="badge ${warn ? 'warn' : 'ok'}">${held ?? '?'}일</span>
      `;
      tiersEl.appendChild(row);
    });
    if (acc.pending_order) {
      const p = acc.pending_order;
      const row = document.createElement('div');
      row.className = 'tier-row';
      row.innerHTML = `
        <div>
          <div class="main">체결대기 · ${p.quantity}주</div>
          <div class="sub">$${p.order_price_used.toFixed(2)}</div>
        </div>
        <span class="badge">대기</span>
      `;
      tiersEl.appendChild(row);
    }
  }

  const history = acc.history || [];
  const ctx = document.getElementById('trend');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: history.map(h => h.date),
      datasets: [{
        data: history.map(h => h.total_assets),
        borderColor: '#c9a227',
        backgroundColor: 'rgba(201,162,39,0.08)',
        fill: true, tension: 0.25, pointRadius: 0, borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: {
          display: true,
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#8b909c',
            font: { family: 'JetBrains Mono', size: 10 },
            callback: (v) => '$' + Math.round(v).toLocaleString('en-US'),
            maxTicksLimit: 4,
          },
        },
      },
    }
  });

  const perf = computePerformance(history);
  const compareEl = document.getElementById('compare');
  const actualPct = perf === null ? 0 : Math.max(perf.value, 0);
  const maxRef = Math.max(BACKTEST_CAGR, actualPct, 1);
  const actualLabel = perf === null
    ? '데이터 부족'
    : (perf.mode === 'cumulative'
        ? `${perf.value.toFixed(1)}% (누적, ${Math.round(perf.days)}일)`
        : `${perf.value.toFixed(1)}% (연환산)`);
  compareEl.innerHTML = `
    <div class="compare-row">
      <div class="top"><span>백테스트 (연환산)</span><span>${BACKTEST_CAGR}%</span></div>
      <div class="bar"><div class="bar-fill gold" style="width:${(BACKTEST_CAGR/maxRef*100).toFixed(1)}%"></div></div>
    </div>
    <div class="compare-row">
      <div class="top"><span>실전</span><span>${actualLabel}</span></div>
      <div class="bar"><div class="bar-fill teal" style="width:${(actualPct/maxRef*100).toFixed(1)}%"></div></div>
    </div>
  `;
  if (perf && perf.mode === 'cumulative') {
    const note = document.createElement('p');
    note.style.cssText = 'font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:6px;';
    note.textContent = '※ 30일 미만 데이터라 연환산 대신 누적수익률로 표시 중';
    compareEl.appendChild(note);
  }
}

fetch('./data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    currentData = data;
    document.getElementById('updated').textContent = '업데이트: ' + new Date(data.updated_at).toLocaleString('ko-KR');

    const tabsEl = document.getElementById('tabs');
    const keys = Object.keys(data.accounts);
    keys.forEach(key => {
      const btn = document.createElement('button');
      btn.textContent = data.accounts[key].label || key;
      btn.dataset.key = key;
      btn.onclick = () => renderAccount(key);
      tabsEl.appendChild(btn);
    });
    if (keys.length > 0) renderAccount(keys[0]);
  })
  .catch(err => {
    document.getElementById('updated').textContent = '데이터를 불러오지 못했습니다.';
    console.error(err);
  });
</script>
</body>
</html>
