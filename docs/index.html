<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해외투자 현황</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #12151a;
  --panel: #1b1f27;
  --border: #2a2f38;
  --text: #e8e6e1;
  --text-dim: #8b909c;
  --gold: #c9a227;
  --teal: #4fb3a5;
  --red: #c1554b;
  --blue: #5b8fd6;
  --violet: #8a7fd6;
  --sans: 'Space Grotesk', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 60px; }

header { margin-bottom: 20px; }
/* 2026-10-18: 국내 배당투자 대시보드(Kiwoom-Auto-Trade)의 녹색 타이틀바와 짝을 이루는 해외 쪽 타이틀바 —
   다크 테마에 맞춘 짙은 남색 */
.titlebar {
  background: #23375f;
  border-radius: 6px 6px 0 0;
  padding: 12px 16px;
  margin-bottom: 10px;
}
.titlebar h1 { margin: 0; font-family: var(--sans); font-size: 16px; font-weight: 700; color: #fff; }
header .updated {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 0;
}

section.panel {
  border-top: 1px solid var(--border);
  padding: 18px 0;
}
section.panel:first-of-type { border-top: none; padding-top: 0; }

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}
.metrics.cols-3 { grid-template-columns: repeat(3, 1fr); }
.metrics.cols-3 .value { font-size: 13px; }
.metric {
  background: var(--bg);
  padding: 12px 8px;
}
.metric .label {
  font-size: 11px;
  color: var(--text-dim);
  margin: 0 0 6px;
}
.metric .value {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  margin: 0;
}
.metric.gold .value { color: var(--gold); }
.metric.teal .value { color: var(--teal); }
.metric.violet .value { color: var(--violet); }
.metric.blue .value { color: var(--blue); }
.metric.red .value { color: var(--red); }
.metric .value .sub {
  display: block;
  font-size: 10px;
  font-weight: 500;
  color: var(--text-dim);
  margin-top: 3px;
}

h2.section-title {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
  margin: 0 0 12px;
}

.chart-wrap { position: relative; height: 220px; }

.legend-row {
  display: flex; gap: 14px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  margin-top: 10px;
}
.legend-row span { display: flex; align-items: center; gap: 5px; }
.legend-row i { width: 9px; height: 9px; display: inline-block; border-radius: 1px; }

footer {
  margin-top: 30px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
}
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar"><h1>해외투자 현황</h1></div>
  <header>
    <p class="updated" id="updated">불러오는 중...</p>
    <p class="updated" id="grand-total" style="margin-top:4px; font-size:13px; color:var(--text);"></p>
  </header>

  <!-- p458/dSuf/dSuf(Toss) 비교 뷰 -->
  <div id="view-p458dsuf">
    <section class="panel">
      <div class="metrics">
        <div class="metric gold"><p class="label">dSuf(Toss)</p><p class="value" id="pd-dsuf-toss">-</p></div>
        <div class="metric blue"><p class="label">p458</p><p class="value" id="pd-p458">-</p></div>
        <div class="metric red"><p class="label">dSuf</p><p class="value" id="pd-dsuf">-</p></div>
        <div class="metric violet"><p class="label">총자산</p><p class="value" id="pd-total">-</p></div>
      </div>
    </section>

    <section class="panel">
      <h2 class="section-title">SOXL 대비 자산추이 (누적수익률 %)</h2>
      <div class="chart-wrap"><canvas id="pd-chart"></canvas></div>
      <div class="legend-row">
        <span><i style="background:#c9a227"></i>dSuf(Toss)</span>
        <span><i style="background:#5b8fd6"></i>p458</span>
        <span><i style="background:#c1554b"></i>dSuf</span>
        <span><i style="background:#8a7fd6"></i>Total</span>
        <span><i style="background:#8b909c"></i>SOXL</span>
      </div>
    </section>

    <section class="panel">
      <h2 class="section-title">총자산 (연초~현재, $)</h2>
      <div class="chart-wrap"><canvas id="ta-chart"></canvas></div>
      <div class="legend-row">
        <span><i style="background:#8a7fd6"></i>총자산</span>
        <span><i style="background:#8b909c"></i>SOXL(우측축)</span>
        <span id="ta-proj-legend" style="display:none"><i style="background:#c9a227"></i>예상 중앙값 · 띠 25~75% / 10~90%</span>
      </div>
      <p id="ta-proj-note" style="display:none; margin:6px 0 0; font-family:var(--mono); font-size:11px; color:var(--text-dim);"></p>
    </section>
  </div>

  <footer>oifrit/Toss-Auto-Trade</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
let pdChart = null;
let currentData = null;

function fmtMoney(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

// 2026-10-14 추가: renderP458Dsuf()의 monthDividerPlugin(지역변수, 자기 labels에 닫혀있음)과
// 같은 동작을 ta-chart에서도 쓰기 위한 공용 팩토리.
function monthDividerPluginFor(labels) {
  return {
    id: 'monthDivider',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const xScale = scales.x;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      labels.forEach((d, idx) => {
        if (idx === 0) return;
        if (d.slice(5, 7) !== labels[idx - 1].slice(5, 7)) {
          const x = xScale.getPixelForValue(idx);
          ctx.beginPath();
          ctx.moveTo(x, chartArea.top);
          ctx.lineTo(x, chartArea.bottom);
          ctx.stroke();
        }
      });
      ctx.restore();
    },
  };
}

function monthTickCallback(labels) {
  return function (val, idx) {
    const d = labels[idx];
    if (!d) return '';
    const month = d.slice(5, 7);
    if (idx === 0 || labels[idx - 1].slice(5, 7) !== month) {
      return parseInt(month, 10) + '월';
    }
    return '';
  };
}

const PCT_BASE_DATE = '2026-09-21'; // 그래프 누적수익률 기준일

function toPctSeries(values) {
  const base = values.find(v => v !== null && v !== undefined && v !== 0);
  if (base === undefined) return values.map(() => null);
  return values.map(v => (v === null || v === undefined) ? null : (v / base - 1) * 100);
}

function renderP458Dsuf() {
  const pd = currentData.p458dsuf || { history: [], soxl_history: [] };
  // toss_p458dsuf_sync.py가 acct.xlsx 읽을 때 주말 행을 걸러내므로(2026-09-30 추가) history는 거래일만 담김.
  // 그래프는 이 history의 날짜에 해당하는 SOXL 캔들만 그대로 매칭해서 사용.
  const fullHistory = pd.history || [];
  const soxlHistory = pd.soxl_history || [];
  // 그래프/수익률 계산은 전부 PCT_BASE_DATE부터 시작 (그 이전 날짜는 잘라냄 - 기준일 이전 구간까지
  // "기준일 대비 %"로 그리면 부호가 뒤집혀 보여서 오해를 살 수 있음, 2026-09-30 변경)
  const baseIdx0 = fullHistory.findIndex(h => h.date >= PCT_BASE_DATE);
  const history = baseIdx0 >= 0 ? fullHistory.slice(baseIdx0) : fullHistory;

  const last = history[history.length - 1];
  const first = history[0];
  function withPct(curVal, firstVal) {
    if (curVal === null || curVal === undefined) return '-';
    if (!first || !firstVal) return fmtMoney(curVal);
    const pct = (curVal / firstVal - 1) * 100;
    const sign = pct >= 0 ? '+' : '';
    return `${fmtMoney(curVal)} <span class="sub">(${sign}${pct.toFixed(1)}%)</span>`;
  }
  document.getElementById('pd-p458').innerHTML = last ? withPct(last.p458, first.p458) : '-';
  document.getElementById('pd-dsuf').innerHTML = last ? withPct(last.dsuf, first.dsuf) : '-';
  document.getElementById('pd-total').innerHTML = last ? withPct(last.total, first.total) : '-';

  // dSuf(Toss) 타일: $금액 뒤에 (B:버퍼)(9/21기준 누적수익률)(보유 티어수)를 작은 글씨로 붙여서 표기.
  // 수익률은 p458/dSuf와 동일하게 p458dsuf.history[].dsuf_toss(acct.xlsx "dSuf(Toss)" 컬럼,
  // PCT_BASE_DATE 기준)로 계산한다 — 이 컬럼은 과거 데이터가 이미 있으므로,
  // accounts.dsuf_toss.history(2026-10-01부터 새로 쌓기 시작한 것)보다 이쪽이 맞다.
  const dsufTossAcc = Object.values(currentData.accounts || {}).find(a => a.label === 'dSuf(Toss)');
  const pdDsufTossEl = document.getElementById('pd-dsuf-toss');
  if (dsufTossAcc) {
    const buffer = Math.round(dsufTossAcc.buffer_usd || 0);
    const tierCount = (dsufTossAcc.tiers || []).length;
    let dsufTossTilePct = 0;
    if (first && first.dsuf_toss) dsufTossTilePct = (last.dsuf_toss / first.dsuf_toss - 1) * 100;
    const dsufTossPctStr = `${dsufTossTilePct >= 0 ? '+' : ''}${dsufTossTilePct.toFixed(1)}%`;
    pdDsufTossEl.innerHTML = `${fmtMoney(dsufTossAcc.total_invest)} <span class="sub">(B:${buffer})(${dsufTossPctStr})(${tierCount})</span>`;
  } else {
    pdDsufTossEl.textContent = '-';
  }

  const soxlMap = {};
  soxlHistory.forEach(s => { soxlMap[s.date] = s.close; });

  const labels = history.map(h => h.date);
  const p458Pct = toPctSeries(history.map(h => h.p458));
  const dsufPct = toPctSeries(history.map(h => h.dsuf));
  const dsufTossPct = toPctSeries(history.map(h => h.dsuf_toss !== undefined ? h.dsuf_toss : null));
  const totalPct = toPctSeries(history.map(h => h.total));
  const soxlPct = toPctSeries(labels.map(d => soxlMap[d] !== undefined ? soxlMap[d] : null));

  // 마우스오버 시 보여줄 실제값(달러/가격) 맵 — 인덱스로 조회
  const realValues = {
    p458: history.map(h => h.p458),
    dSuf: history.map(h => h.dsuf),
    'dSuf(Toss)': history.map(h => h.dsuf_toss !== undefined ? h.dsuf_toss : null),
    Total: history.map(h => h.total),
    SOXL: labels.map(d => soxlMap[d] !== undefined ? soxlMap[d] : null),
  };

  // 월이 바뀌는 인덱스마다 세로 구분선을 그리는 플러그인
  const monthDividerPlugin = {
    id: 'monthDivider',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const xScale = scales.x;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      labels.forEach((d, idx) => {
        if (idx === 0) return;
        if (d.slice(5, 7) !== labels[idx - 1].slice(5, 7)) {
          const x = xScale.getPixelForValue(idx);
          ctx.beginPath();
          ctx.moveTo(x, chartArea.top);
          ctx.lineTo(x, chartArea.bottom);
          ctx.stroke();
        }
      });
      ctx.restore();
    },
  };

  const ctx = document.getElementById('pd-chart');
  if (pdChart) pdChart.destroy();
  pdChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'dSuf(Toss)', data: dsufTossPct, borderColor: '#c9a227', pointRadius: 0, borderWidth: 1, borderDash: [2,2], tension: 0.2 },
        { label: 'p458', data: p458Pct, borderColor: '#5b8fd6', pointRadius: 0, borderWidth: 1, borderDash: [2,2], tension: 0.2 },
        { label: 'dSuf', data: dsufPct, borderColor: '#c1554b', pointRadius: 0, borderWidth: 1, borderDash: [2,2], tension: 0.2 },
        { label: 'Total', data: totalPct, borderColor: '#8a7fd6', pointRadius: 0, borderWidth: 1.5, tension: 0.2 },
        { label: 'SOXL', data: soxlPct, borderColor: '#8b909c', pointRadius: 0, borderWidth: 1, borderDash: [2,2], tension: 0.2 },
      ]
    },
    plugins: [monthDividerPlugin],
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (item) => {
              const idx = item.dataIndex;
              const name = item.dataset.label;
              const raw = realValues[name] ? realValues[name][idx] : null;
              const pct = item.parsed.y;
              const pctStr = (pct === null || pct === undefined) ? '-' : `${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
              if (raw === null || raw === undefined) return `${name}: ${pctStr}`;
              const realStr = name === 'SOXL' ? `$${raw.toFixed(2)}` : fmtMoney(raw);
              return `${name}: ${realStr} (${pctStr})`;
            },
          },
        },
      },
      scales: {
        x: {
          display: true,
          grid: { display: false },
          ticks: {
            color: '#8b909c',
            font: { family: 'JetBrains Mono', size: 10 },
            autoSkip: false,
            maxRotation: 0,
            callback: monthTickCallback(labels),
          },
        },
        y: {
          display: true,
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#8b909c',
            font: { family: 'JetBrains Mono', size: 10 },
            callback: (v) => v.toFixed(0) + '%',
            maxTicksLimit: 5,
          },
        },
      },
    }
  });
}

// 2026-10-14 사용자 요청: acct.xlsx 두번째 시트(2026.01~08)까지 합쳐서 연초부터의 총자산+SOXL
// 종가를 그대로($, %아님) 보여주는 별도 그래프. 2026-10-18 사용자 요청으로 총자산+SOXL 두 라인만 남김
// (p458/dSuf/dSuf(Toss) 개별 라인은 제거 — 위 비교차트에 이미 있음).
let taChart = null;
// 2026-10-21 사용자 요청: 예상 자산증가(MC) 대비 현재 자산 위치를 보기 위한 띠.
// projection.json = ETC/portfolio_projection.py 출력(기준일 대비 배율의 거래일별 5~95% 분위수, 장부가 기준).
// t(거래일) = history 라벨 순서상 기준일로부터의 칸 수(history는 SOXL 거래일 정렬이라 거래일과 맞음).
let projection = null;

function projectionSeries(labels) {
  if (!projection) return null;
  const b = labels.indexOf(projection.base_date);
  if (b < 0) return null;
  const at = (L) => labels.map((_, i) => {
    const t = i - b;
    const arr = projection.bands[String(L)];
    return (t >= 0 && t < arr.length) ? projection.base_total * arr[t] : null;
  });
  return { base: b, p10: at(10), p25: at(25), p50: at(50), p75: at(75), p90: at(90) };
}

// 현재 장부가 배율이 그 날짜 분포의 몇 % 위치인지(5% 간격 분위수 사이 선형보간)
function projectionPercentile(t, ratio) {
  const lv = projection.levels;
  const v = lv.map(L => projection.bands[String(L)][t]);
  if (ratio <= v[0]) return { text: `하위 ${lv[0]}% 미만`, below: true };
  if (ratio >= v[v.length - 1]) return { text: `상위 ${100 - lv[lv.length - 1]}% 이내`, below: false };
  for (let k = 1; k < v.length; k++) {
    if (ratio <= v[k]) {
      const p = lv[k - 1] + (lv[k] - lv[k - 1]) * (ratio - v[k - 1]) / ((v[k] - v[k - 1]) || 1);
      return { text: `하위 ${Math.round(p)}%`, below: p < 50 };
    }
  }
}

function renderTotalAssetChart() {
  const pd = currentData.p458dsuf || { history: [], soxl_history: [] };
  const history = pd.history || [];
  if (!history.length) return;
  const soxlMap = {};
  (pd.soxl_history || []).forEach(s => { soxlMap[s.date] = s.close; });

  const labels = history.map(h => h.date);
  // 2026-10-21 사용자 요청: 예상 띠가 보이도록 x축을 '현재월+3개월' 말일까지 미래 평일로 연장
  // (예상이 있을 때만. 미국 휴장일은 무시 — 띠의 t 매핑도 이 라벨 순서를 따르므로 근사).
  if (projection) {
    const now = new Date();
    const end = new Date(now.getFullYear(), now.getMonth() + 4, 0);  // 현재월+3개월의 말일
    const d = new Date(labels[labels.length - 1] + 'T00:00:00');
    const iso = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
    for (d.setDate(d.getDate() + 1); d <= end; d.setDate(d.getDate() + 1)) {
      if (d.getDay() !== 0 && d.getDay() !== 6) labels.push(iso(d));
    }
  }
  const totalSeries = labels.map((_, i) => i < history.length ? history[i].total : null);
  const soxlSeries = labels.map(d => soxlMap[d] !== undefined ? soxlMap[d] : null);

  const proj = projectionSeries(labels);
  const bandStyle = { pointRadius: 0, borderWidth: 0, tension: 0.2, yAxisID: 'y', _band: true };
  const projDatasets = proj ? [
    { ...bandStyle, label: '예상10', data: proj.p10, fill: false },
    { ...bandStyle, label: '예상90', data: proj.p90, fill: '-1', backgroundColor: 'rgba(201,162,39,0.10)' },
    { ...bandStyle, label: '예상25', data: proj.p25, fill: false },
    { ...bandStyle, label: '예상75', data: proj.p75, fill: '-1', backgroundColor: 'rgba(201,162,39,0.20)' },
    { label: '예상 중앙값', data: proj.p50, borderColor: '#c9a227', pointRadius: 0, borderWidth: 1.2, borderDash: [4,3], tension: 0.2, yAxisID: 'y', fill: false },
  ] : [];

  if (proj) {
    const last = history.length - 1;
    const t = last - proj.base;
    const ratio = history[last].total / projection.base_total;
    const pos = projectionPercentile(t, ratio);
    const med = projection.bands['50'][t] * projection.base_total;
    document.getElementById('ta-proj-legend').style.display = '';
    const note = document.getElementById('ta-proj-note');
    note.style.display = '';
    note.innerHTML = `예상(${projection.base_date} 기준 ${fmtMoney(projection.base_total)}, MC ${projection.n_sims}회, 수수료 포함, 장부가 기준, 중앙값 CAGR ${(projection.median_cagr*100).toFixed(0)}%) — `
      + `현재 ${fmtMoney(history[last].total)} vs 예상 중앙값 ${fmtMoney(med)} · <b style="color:${pos.below ? 'var(--red)' : 'var(--teal)'}">${pos.text}</b>`;
  }

  const ctx = document.getElementById('ta-chart');
  if (taChart) taChart.destroy();
  taChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '총자산', data: totalSeries, borderColor: '#8a7fd6', pointRadius: 0, borderWidth: 1.5, tension: 0.2, yAxisID: 'y' },
        { label: 'SOXL', data: soxlSeries, borderColor: '#8b909c', pointRadius: 0, borderWidth: 1, borderDash: [2,2], tension: 0.2, yAxisID: 'y1' },
        ...projDatasets,
      ]
    },
    plugins: [monthDividerPluginFor(labels)],
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          // 띠 경계(예상10/25/75/90)는 툴팁에서 빼고, 중앙값 줄에 25~75% 범위를 같이 표시
          filter: (item) => !item.dataset._band,
          callbacks: {
            label: (item) => {
              const name = item.dataset.label;
              const v = item.parsed.y;
              if (v === null || v === undefined) return `${name}: -`;
              if (name === '예상 중앙값' && proj) {
                const i = item.dataIndex;
                return `${name}: ${fmtMoney(v)} (25~75%: ${fmtMoney(proj.p25[i])}~${fmtMoney(proj.p75[i])})`;
              }
              return name === 'SOXL' ? `${name}: $${v.toFixed(2)}` : `${name}: ${fmtMoney(v)}`;
            },
          },
        },
      },
      scales: {
        x: {
          display: true,
          grid: { display: false },
          ticks: {
            color: '#8b909c',
            font: { family: 'JetBrains Mono', size: 10 },
            autoSkip: false,
            maxRotation: 0,
            callback: monthTickCallback(labels),
          },
        },
        y: {
          position: 'left',
          display: true,
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#8b909c',
            font: { family: 'JetBrains Mono', size: 10 },
            callback: (v) => fmtMoney(v),
            maxTicksLimit: 5,
          },
        },
        y1: {
          position: 'right',
          display: true,
          grid: { display: false },
          ticks: {
            color: '#8b909c',
            font: { family: 'JetBrains Mono', size: 10 },
            callback: (v) => '$' + v.toFixed(0),
            maxTicksLimit: 5,
          },
        },
      },
    }
  });
}

fetch('./data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    currentData = data;
    document.getElementById('updated').textContent = '업데이트: ' + new Date(data.updated_at).toLocaleString('ko-KR');

    if (data.p458dsuf) renderP458Dsuf();
    if (data.p458dsuf) {
      renderTotalAssetChart();
      // 예상 띠는 별도 파일 — 없거나 실패해도 기존 그래프는 그대로
      fetch('./projection.json?_=' + Date.now())
        .then(r => r.ok ? r.json() : null)
        .then(p => { if (p) { projection = p; renderTotalAssetChart(); } })
        .catch(() => {});
    }

    // p458dsuf.history[].total은 이제 dSuf(Toss)(acct.xlsx 스냅샷, 버퍼포함)까지 합산된 값이라,
    // 상단 총자산 요약은 그 dSuf(Toss)를 빼고 accounts.dsuf_toss.total_invest(실시간 값)로 대체해서
    // 이중합산을 피하고 최신값을 쓴다.
    // 상단 요약(총자산/변동분)은 아래 그래프와 달리 SOXL 거래일 정렬이 필요 없으므로,
    // history(주말 제외, 차트용)가 아니라 latest_raw(주말 포함, acct.xlsx에 실제로 적힌 가장 최근
    // 값 그대로)를 쓴다 — 그래프만 history/soxl_history 기준 SOXL 일봉에 맞춰 표기 (2026-10-12).
    const dsufTossAcc = Object.values(data.accounts || {}).find(a => a.label === 'dSuf(Toss)');
    const dsufTossTotalInvest = dsufTossAcc ? dsufTossAcc.total_invest : 0;
    const pdLatestRaw = (data.p458dsuf && data.p458dsuf.latest_raw) || [];
    const pdLatest = pdLatestRaw.length ? pdLatestRaw[pdLatestRaw.length - 1] : null;
    const pdP458DsufOnly = pdLatest ? (pdLatest.p458 + pdLatest.dsuf) : 0;
    const grandTotalUsd = dsufTossTotalInvest + pdP458DsufOnly;
    const grandEl = document.getElementById('grand-total');

    // 전일 대비 변동분: 각 계좌 히스토리의 마지막 두 스냅샷 차이를 더함
    // (dSuf(Toss)/p458dsuf 히스토리 날짜가 서로 안 맞아도 각자 자기 시계열 기준으로 변동을 구하므로 문제없음)
    const dsufTossHist = (dsufTossAcc && dsufTossAcc.history) || [];
    const dsufTossDelta = dsufTossHist.length >= 2
      ? dsufTossHist[dsufTossHist.length - 1].total_assets - dsufTossHist[dsufTossHist.length - 2].total_assets
      : 0;
    const pdDelta = pdLatestRaw.length >= 2
      ? (pdLatestRaw[pdLatestRaw.length - 1].p458 + pdLatestRaw[pdLatestRaw.length - 1].dsuf)
        - (pdLatestRaw[pdLatestRaw.length - 2].p458 + pdLatestRaw[pdLatestRaw.length - 2].dsuf)
      : 0;
    const grandDelta = dsufTossDelta + pdDelta;
    const deltaSign = grandDelta > 0 ? '+' : '';
    // 국내 증시 관행: 상승(+)은 빨강, 하락(-)은 파랑
    const deltaColor = grandDelta > 0 ? 'var(--red)' : (grandDelta < 0 ? 'var(--blue)' : 'var(--text-dim)');
    const deltaHtml = `<span style="color:${deltaColor}">(${deltaSign}${Math.round(grandDelta).toLocaleString('en-US')})</span>`;

    if (data.usd_krw_rate) {
      const krw = grandTotalUsd * data.usd_krw_rate;
      const rateStr = data.usd_krw_rate.toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1});
      const rateHtml = `<span style="color:var(--teal)">/${rateStr}원</span>`;
      grandEl.innerHTML = `총자산: $${Math.round(grandTotalUsd).toLocaleString('en-US')} ${deltaHtml} ( ₩${Math.round(krw).toLocaleString('en-US')}  ${rateHtml})`;
    } else {
      grandEl.innerHTML = `총자산: $${Math.round(grandTotalUsd).toLocaleString('en-US')} ${deltaHtml} (환율 정보 없음)`;
    }
  })
  .catch(err => {
    document.getElementById('updated').textContent = '데이터를 불러오지 못했습니다.';
    console.error(err);
  });
</script>
